name: 나라별 방문자 갱신

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 집계 가져오기
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -z "$GOATCOUNTER_TOKEN" ]; then
            echo "토큰이 없어 건너뜁니다"
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $GOATCOUNTER_TOKEN" -H 'Content-Type: application/json' \
            'https://slrtm3tp.goatcounter.com/api/v0/stats/locations?start=2026-11-03T00:00:00Z&limit=100' -o /tmp/raw.json
          jq '{countries: ([.stats[] | select(.id | test("^[A-Z]{2}$")) | select(.count >= 3) | {code: .id, count: .count}] | sort_by(-.count))}' /tmp/raw.json > visitors.json
          jq -r '"전체 \(.stats | length)곳, 나라 코드 형식 \([.stats[] | select(.id | test("^[A-Z]{2}$"))] | length)곳"' /tmp/raw.json
      - name: 바뀌었으면 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- visitors.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitors.json
          git commit -m '나라별 방문자 갱신'
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
